<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI ROI Calculator</title>
  <style>
    :root {
      --bg: #f1e8d7;            /* warm cream backdrop */
      --card: #fbf6ec;          /* paper */
      --rule: #e4d8c2;
      --rule-soft: #ece2d0;
      --text: #382c24;          /* espresso */
      --muted: #877963;
      --faint: #a89a83;
      --accent: #7a2531;        /* oxblood */
      --accent-deep: #5e1c26;
      --accent-soft: #f4e4e2;
      --positive: #4f7a4d;
      --negative: #a23a32;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
        "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
        Arial, sans-serif;
      --mono: "SF Mono", "Iosevka", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 20px;
    }

    .card {
      width: 100%;
      max-width: 580px;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(74, 44, 30, 0.10);
      padding: 40px 40px 32px;
    }

    /* ---- Header ---- */
    .masthead {
      text-align: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--rule);
    }

    .kicker {
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 14px;
    }

    .masthead h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.9rem, 6vw, 2.6rem);
      line-height: 1.08;
      letter-spacing: -0.01em;
      margin: 0;
      color: var(--accent-deep);
    }

    .dek {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.02rem;
      line-height: 1.55;
      color: var(--muted);
      max-width: 42ch;
      margin: 14px auto 0;
    }

    /* ---- Inputs ---- */
    .inputs {
      display: grid;
      gap: 18px;
      margin-top: 26px;
    }

    .field label {
      display: block;
      font-family: var(--serif);
      font-size: 1.04rem;
      margin-bottom: 7px;
    }

    .field .hint {
      font-family: var(--sans);
      font-weight: 400;
      font-size: 0.78rem;
      color: var(--faint);
      margin-left: 6px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap .affix {
      position: absolute;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 1.05rem;
      pointer-events: none;
    }

    .input-wrap .affix.prefix { left: 16px; }
    .input-wrap .affix.suffix { right: 16px; }

    .field input {
      width: 100%;
      background: #fffdf8;
      border: 1px solid var(--rule);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 1.05rem;
      padding: 13px 16px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      -moz-appearance: textfield;
    }

    .field input.pad-left { padding-left: 30px; }
    .field input.pad-right { padding-right: 46px; }

    .field input::-webkit-outer-spin-button,
    .field input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* ---- Results ---- */
    .results {
      margin-top: 30px;
      padding: 24px;
      background: #f7efe1;
      border: 1px solid var(--rule);
      border-radius: 14px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .metric { padding: 0 4px; }
    .metric + .metric {
      border-left: 1px solid var(--rule);
      padding-left: 24px;
    }

    .metric .metric-label {
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 8px;
    }

    .metric .metric-value {
      font-family: var(--serif);
      font-size: clamp(1.9rem, 7vw, 2.4rem);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .positive { color: var(--positive); }
    .negative { color: var(--negative); }

    .equation {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--rule);
    }

    .eq-label {
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 12px;
    }

    .equation .math {
      background: #fffdf8;
      border: 1px solid var(--rule-soft);
      border-radius: 10px;
      padding: 22px 18px 18px;
    }

    .mathline {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-family: var(--serif);
      font-size: 1.2rem;
      line-height: 1.3;
      color: var(--text);
    }

    .frac {
      display: inline-flex;
      flex-direction: column;
      max-width: 100%;
    }

    .frac .num {
      padding: 0 16px 8px;
      text-align: center;
      border-bottom: 1.5px solid var(--text);
    }

    .frac .den {
      padding: 8px 16px 0;
      text-align: center;
    }

    /* keep the parenthesised term from breaking mid-expression */
    .frac .grp { white-space: nowrap; }

    .mathline .tail {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .mathline val {
      font-style: normal;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }

    .mathline .op { color: var(--faint); }

    .mathline .answer {
      font-weight: 700;
      font-size: 1.45rem;
    }

    .mathstep {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed var(--rule);
      text-align: center;
      font-family: var(--sans);
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--muted);
    }

    .mathstep b { color: var(--text); font-weight: 600; }

    .math.invalid {
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 460px) {
      .mathline { font-size: 1.05rem; }
      .mathline .answer { font-size: 1.25rem; }
    }

    /* ---- Interpretation (pull quote) ---- */
    .interpretation {
      margin: 28px 0 0;
      padding: 4px 0 4px 22px;
      border-left: 3px solid var(--accent);
      font-family: var(--serif);
      font-size: 1.14rem;
      font-style: italic;
      line-height: 1.55;
      color: var(--text);
    }

    .interpretation strong {
      font-style: normal;
      font-weight: 600;
      color: var(--accent);
    }

    .colophon {
      margin: 30px 0 0;
      padding-top: 16px;
      border-top: 1px solid var(--rule-soft);
      font-family: var(--sans);
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      color: var(--faint);
      text-align: center;
    }

    @media (max-width: 460px) {
      body { padding: 28px 14px; }
      .card { padding: 28px 22px 24px; }
      .result-grid { grid-template-columns: 1fr; gap: 22px; }
      .metric + .metric {
        border-left: none;
        padding-left: 4px;
        border-top: 1px solid var(--rule);
        padding-top: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="masthead">
      <p class="kicker">The Productivity Ledger</p>
      <h1>AI ROI Calculator</h1>
      <p class="dek">What does an engineer's AI toolkit actually return each
         month? Set the figures below and read the verdict.</p>
    </header>

    <section class="inputs">
      <div class="field">
        <label for="rate">Engineer bill rate
          <span class="hint">$ per hour</span></label>
        <div class="input-wrap">
          <span class="affix prefix">$</span>
          <input id="rate" class="pad-left" type="number" min="0" step="1"
                 inputmode="decimal" placeholder="150" value="150" />
        </div>
      </div>

      <div class="field">
        <label for="hours">Hours worked per month
          <span class="hint">defaults to 160 — 40 hrs × 4 weeks</span></label>
        <div class="input-wrap">
          <span class="affix suffix">hrs</span>
          <input id="hours" class="pad-right" type="number" min="0" step="1"
                 inputmode="decimal" placeholder="160" value="160" />
        </div>
      </div>

      <div class="field">
        <label for="boost">Productivity increase
          <span class="hint">a whole number, e.g. 20 for 20%</span></label>
        <div class="input-wrap">
          <span class="affix suffix">%</span>
          <input id="boost" class="pad-right" type="number" min="0" step="1"
                 inputmode="decimal" placeholder="20" value="20" />
        </div>
      </div>

      <div class="field">
        <label for="cost">Total monthly AI cost
          <span class="hint">$ per month</span></label>
        <div class="input-wrap">
          <span class="affix prefix">$</span>
          <input id="cost" class="pad-left" type="number" min="0" step="1"
                 inputmode="decimal" placeholder="100" value="100" />
        </div>
      </div>
    </section>

    <section class="results">
      <div class="result-grid">
        <div class="metric">
          <div class="metric-label">Return on Investment</div>
          <div class="metric-value" id="roiValue">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Net Monthly Gain</div>
          <div class="metric-value" id="gainValue">—</div>
        </div>
      </div>

      <div class="equation">
        <div class="eq-label">Showing the work</div>
        <div id="equation" class="math">—</div>
      </div>
    </section>

    <blockquote class="interpretation" id="interpretation">—</blockquote>

    <p class="colophon">ROI = [ (Rate × Hours × Productivity %) − Cost ] ÷ Cost × 100</p>
  </main>

  <script>
    (function () {
      var rateEl = document.getElementById("rate");
      var hoursEl = document.getElementById("hours");
      var boostEl = document.getElementById("boost");
      var costEl = document.getElementById("cost");

      var roiEl = document.getElementById("roiValue");
      var gainEl = document.getElementById("gainValue");
      var eqEl = document.getElementById("equation");
      var interpEl = document.getElementById("interpretation");

      function fmtMoney(n) {
        return n.toLocaleString("en-US", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 0
        });
      }

      function fmtNum(n, dp) {
        return n.toLocaleString("en-US", {
          minimumFractionDigits: dp,
          maximumFractionDigits: dp
        });
      }

      // Accept a whole number (20) or a percentage string ("20%"); both mean 20%.
      function parsePercent(raw) {
        return parseFloat(String(raw).replace("%", "").trim());
      }

      function calc() {
        var R = parseFloat(rateEl.value);
        var H = parseFloat(hoursEl.value); // hours worked per month
        var P = parsePercent(boostEl.value); // productivity increase, in percent
        var C = parseFloat(costEl.value);

        var valid = isFinite(R) && isFinite(H) && isFinite(P) && isFinite(C) && C > 0;

        if (!valid) {
          roiEl.textContent = "—";
          gainEl.textContent = "—";
          roiEl.className = "metric-value";
          gainEl.className = "metric-value";
          eqEl.className = "math invalid";
          eqEl.innerHTML = "Enter a bill rate, hours worked, a productivity increase, and a monthly cost greater than $0.";
          interpEl.innerHTML = "Fill in all four figures to read the verdict.";
          return;
        }

        var fraction = P / 100; // equivalent of (M − 1)
        // Value of the extra productive hours AI unlocks each month.
        var grossGain = R * H * fraction;
        var netGain = grossGain - C;
        var roi = (netGain / C) * 100;

        roiEl.textContent = fmtNum(roi, 0) + "%";
        gainEl.textContent = fmtMoney(netGain);

        roiEl.className = "metric-value " + (roi >= 0 ? "positive" : "negative");
        gainEl.className = "metric-value " + (netGain >= 0 ? "positive" : "negative");

        // Typeset the formula with the user's current values substituted in:
        // a real fraction bar, then a plain-language breakdown beneath it.
        var sign = roi >= 0 ? "positive" : "negative";
        eqEl.className = "math";
        eqEl.innerHTML =
          "<div class='mathline'>" +
            "<span class='frac'>" +
              "<span class='num'>" +
                "<span class='grp'>(<val>" + fmtMoney(R) + "</val> " +
                  "<span class='op'>×</span> <val>" + fmtNum(H, 0) + " hrs</val> " +
                  "<span class='op'>×</span> <val>" + fmtNum(P, 0) + "%</val>)</span> " +
                "<span class='op'>−</span> <val>" + fmtMoney(C) + "</val>" +
              "</span>" +
              "<span class='den'><val>" + fmtMoney(C) + "</val></span>" +
            "</span>" +
            "<span class='tail'>" +
              "<span class='op'>× 100</span>" +
              "<span class='op'>=</span>" +
              "<span class='answer " + sign + "'>" + fmtNum(roi, 0) + "%</span>" +
            "</span>" +
          "</div>" +
          "<div class='mathstep'>" +
            "Extra value created <b>" + fmtMoney(grossGain) + "</b> " +
            "− running cost <b>" + fmtMoney(C) + "</b> " +
            "= net <b>" + fmtMoney(netGain) + "</b> a month" +
          "</div>";

        // Plain-English interpretation.
        var returnPerDollar = grossGain / C; // dollars returned per dollar spent
        var msg;
        if (netGain >= 0) {
          msg = "For every <strong>$1</strong> spent on AI, you're getting back about " +
            "<strong>$" + fmtNum(returnPerDollar, 2) + "</strong> in engineering value — " +
            "a net gain of <strong>" + fmtMoney(netGain) + "</strong> per month, per engineer.";
        } else {
          msg = "Right now it costs more than it returns: every <strong>$1</strong> " +
            "spent yields only <strong>$" + fmtNum(returnPerDollar, 2) + "</strong> back, " +
            "a net loss of <strong>" + fmtMoney(Math.abs(netGain)) + "</strong> a month. " +
            "Try a higher rate or productivity increase, or a lower cost.";
        }
        interpEl.innerHTML = msg;
      }

      [rateEl, hoursEl, boostEl, costEl].forEach(function (el) {
        el.addEventListener("input", calc);
      });

      calc();
    })();
  </script>
</body>
</html>
